# =============================================================================
# MHTI 持续集成工作流
# =============================================================================
# 触发条件：
#   - Pull Request 到 main 分支
#   - 手动触发
#
# 功能：
#   1. 代码检查 (Lint)
#   2. 单元测试
#   3. 构建验证
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:  # 手动触发

jobs:
  # ===========================================================================
  # 后端测试
  # ===========================================================================
  backend-test:
    name: 后端测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 过去这里只装 requirements.txt（不含 pytest），失败又被 `|| echo` 吞掉，
      # 测试实际上从未在 CI 跑过。dev 依赖单独成文件后才能装上测试工具。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 代码检查 (ruff)
        run: ruff check server

      # 渐进式类型门禁：先在 pyproject 的 files 里锁定 models/common，再逐步扩面
      - name: 类型检查 (mypy)
        run: mypy

      - name: 运行测试
        run: |
          pytest server/tests/ -v --cov=server --cov-report=xml --cov-report=term-missing

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # 前端构建测试
  # ===========================================================================
  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 代码检查 (eslint)
        working-directory: web
        run: npm run lint

      - name: 类型检查与构建
        working-directory: web
        run: npm run build:check

      - name: 构建产物检查
        working-directory: web
        run: |
          if [ -d "dist" ]; then
            echo "✅ 构建成功"
            ls -la dist/
          else
            echo "❌ 构建失败：dist 目录不存在"
            exit 1
          fi

  # ===========================================================================
  # Docker 构建测试
  # ===========================================================================
  docker-build:
    name: Docker 构建测试
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建镜像 (不推送)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: mhti:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
